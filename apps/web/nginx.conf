# The API the studio forwards /api, /webhook, /webhook-test, /mcp, /v1 and /health to: the `api` service on port 4000
# (the Docker Compose service name), looked up once when nginx starts. Set L2M_API_UPSTREAM=host:port on the container
# to use another address; the image's start script (nginx-api-upstream.sh) then rewrites the lines between the markers
# below and looks the name up again every 10 seconds, so a redeployed API with a new address is found without a restart.
# l2m-api-upstream:begin
upstream l2m_api {
  server api:4000;
}
# l2m-api-upstream:end

server {
  listen 80;
  server_name _;

  # Uploads (knowledge-base files, workflow imports) are bounded by the API's own limits; nginx's 1 MB default
  # would refuse them first. 40 MB covers a 25 MB PDF sent as base64.
  client_max_body_size 40m;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://l2m_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /webhook/ {
    proxy_pass http://l2m_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /webhook-test/ {
    proxy_pass http://l2m_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The MCP gateway (/mcp/<toolset>): streamed responses, long-lived sessions.
  location /mcp/ {
    proxy_pass http://l2m_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  # The OpenAI-compatible AI gateway (/v1): streamed answers need buffering off.
  location /v1/ {
    proxy_pass http://l2m_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location /health {
    proxy_pass http://l2m_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
